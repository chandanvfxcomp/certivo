<title>Certivo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap">
<style>
  /* ---------------------------------------------------------------------
     Tokens — mirrors the real app's Tailwind theme (src/app/globals.css)
     so this demo and the eventual deployed app read as the same product.
     --------------------------------------------------------------------- */
  :root {
    --bg: #ffffff;
    --bg-subtle: #f8fafc;
    --bg-raised: #ffffff;
    --border: #e2e8f0;
    --border-soft: #f1f5f9;
    --text: #0f172a;
    --text-muted: #64748b;
    --text-faint: #94a3b8;
    --brand: #6366f1;
    --brand-strong: #4f46e5;
    --brand-soft: #eef2ff;
    --success: #16a34a;
    --success-soft: #f0fdf4;
    --warning: #d97706;
    --warning-soft: #fffbeb;
    --danger: #dc2626;
    --danger-soft: #fef2f2;
    --shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 1px 3px rgba(15, 23, 42, 0.06);
    color-scheme: light;
  }
  /* F1: dark mode was previously removed here because nothing in the real
     app added a `.dark` class deliberately — its `dark:` utility classes
     were silently following the OS theme instead (see globals.css's own
     comment). The real fix there was a genuine, deliberate toggle, not
     "remove dark mode" — so that's what this demo now has too: a real
     toggle button (topbar) that adds `.dark` to <html>, with no CSS
     anywhere reacting to prefers-color-scheme on its own. */
  html.dark {
    --bg: #020617;
    --bg-subtle: #0f172a;
    --bg-raised: #0b1220;
    --border: #1e293b;
    --border-soft: #172033;
    --text: #f8fafc;
    --text-muted: #94a3b8;
    --text-faint: #64748b;
    --brand: #818cf8;
    --brand-strong: #a5b4fc;
    --brand-soft: #1e1b4b;
    --success: #4ade80;
    --success-soft: #052e16;
    --warning: #fbbf24;
    --warning-soft: #451a03;
    --danger: #f87171;
    --danger-soft: #450a0a;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 1px 3px rgba(0, 0, 0, 0.4);
    color-scheme: dark;
  }
  .theme-toggle {
    width: 32px; height: 32px; padding: 0; display: flex; align-items: center; justify-content: center;
  }
  .modal-overlay {
    position: fixed; inset: 0; z-index: 60;
    background: rgba(2, 6, 23, 0.55);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .modal-overlay[hidden] { display: none; }
  .modal-box {
    width: 100%; max-width: 520px;
    max-height: min(85vh, 640px);
    display: flex; flex-direction: column;
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    overflow: hidden;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  code, .mono, .mono * { font-family: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace; }
  h1, h2, h3 { text-wrap: balance; margin: 0; }
  p { margin: 0; }
  a { color: inherit; }
  ::selection { background: var(--brand-soft); }

  /* ---- App shell ---- */
  .topbar {
    position: sticky; top: 0; z-index: 30;
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
    padding: 12px clamp(16px, 4vw, 32px);
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  .brand-mark { display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: -0.01em; cursor: pointer; background: none; border: none; color: var(--text); font-size: 15px; padding: 0; }
  .brand-mark .dot { width: 8px; height: 8px; border-radius: 999px; background: var(--brand); box-shadow: 0 0 0 4px var(--brand-soft); }
  .topbar-right { display: flex; align-items: center; gap: 10px; }
  .demo-chip {
    font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
    padding: 4px 9px; border-radius: 999px;
    background: var(--warning-soft); color: var(--warning);
    border: 1px solid color-mix(in srgb, var(--warning) 35%, transparent);
  }
  .who-chip {
    font-size: 12px; color: var(--text-muted);
    padding: 4px 10px; border-radius: 999px; border: 1px solid var(--border);
    display: flex; align-items: center; gap: 6px;
  }

  main { min-height: calc(100vh - 53px); }
  .screen { display: none; }
  .screen.active { display: block; animation: fade-in 0.25s ease-out both; }
  @keyframes fade-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce) { .screen.active { animation: none; } }

  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 32px); }
  .wrap-narrow { max-width: 480px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 32px); }
  .wrap-med { max-width: 720px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 32px); }

  /* ---- Cards / surfaces ---- */
  .card {
    background: var(--bg-raised); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: var(--shadow);
  }
  .card-pad { padding: 24px; }
  .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 560px) { .field-grid { grid-template-columns: 1fr; } }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field.span-2 { grid-column: 1 / -1; }
  label { font-size: 13px; font-weight: 500; color: var(--text-muted); }
  input, select {
    height: 40px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg);
    color: var(--text); padding: 0 12px; font-size: 14px; font-family: inherit;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input:focus, select:focus, button:focus-visible, a:focus-visible {
    outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft);
  }
  input::placeholder { color: var(--text-faint); }

  /* ---- Buttons ---- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    height: 40px; padding: 0 18px; border-radius: 8px; font-size: 14px; font-weight: 600;
    border: 1px solid transparent; cursor: pointer; white-space: nowrap;
    font-family: inherit; transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  .btn-primary { background: var(--brand); color: white; }
  .btn-primary:hover { background: var(--brand-strong); }
  .btn-outline { background: transparent; color: var(--text); border-color: var(--border); }
  .btn-outline:hover { background: var(--bg-subtle); }
  .btn-ghost { background: transparent; color: var(--text-muted); }
  .btn-ghost:hover { color: var(--text); background: var(--bg-subtle); }
  .btn-sm { height: 32px; padding: 0 12px; font-size: 13px; }
  .btn[disabled] { opacity: 0.5; cursor: not-allowed; }

  /* ---- Badges ---- */
  .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; }
  .badge-success { color: var(--success); background: var(--success-soft); }
  .badge-warning { color: var(--warning); background: var(--warning-soft); }
  .badge-danger { color: var(--danger); background: var(--danger-soft); }
  .badge-neutral { color: var(--text-muted); background: var(--bg-subtle); border: 1px solid var(--border); }

  .alert { border-radius: 8px; padding: 10px 14px; font-size: 13px; }
  .alert-danger { background: var(--danger-soft); color: var(--danger); }
  .alert-success { background: var(--success-soft); color: var(--success); }

  /* ---- Landing page pieces ---- */
  .hero { position: relative; overflow: hidden; padding: 56px 0 64px; }
  .blob { position: absolute; border-radius: 999px; filter: blur(56px); pointer-events: none; opacity: 0.35; }
  .blob-a { width: 280px; height: 280px; left: -80px; top: -60px; background: var(--brand); animation: drift 16s ease-in-out infinite; }
  .blob-b { width: 320px; height: 320px; right: -100px; top: 20px; background: var(--brand-strong); animation: drift 18s ease-in-out infinite reverse; opacity: 0.22; }
  @keyframes drift { 0%, 100% { transform: translate(0,0) scale(1); } 50% { transform: translate(4%, -3%) scale(1.06); } }
  .float-icon { position: absolute; color: var(--brand); opacity: 0.55; animation: float 7s ease-in-out infinite; }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
  @media (prefers-reduced-motion: reduce) { .blob, .float-icon { animation: none; } }

  .eyebrow {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600;
    padding: 5px 12px; border-radius: 999px; border: 1px solid var(--border); color: var(--text-muted);
    margin-bottom: 18px;
  }
  .h1 { font-size: clamp(32px, 5vw, 46px); font-weight: 700; letter-spacing: -0.02em; line-height: 1.08; }
  .tagline { font-size: 17px; font-weight: 600; color: var(--brand); margin-top: 8px; }
  .lede { max-width: 540px; margin: 16px auto 0; color: var(--text-muted); font-size: 15.5px; line-height: 1.6; }

  .trust-strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding: 36px 0; }
  @media (max-width: 640px) { .trust-strip { grid-template-columns: 1fr; } }
  .trust-card { text-align: center; padding: 22px 18px; }
  .trust-card svg { color: var(--brand); }
  .trust-card h3 { margin: 10px 0 4px; font-size: 15px; }
  .trust-card p { color: var(--text-muted); font-size: 13.5px; }

  .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; padding: 48px 0; }
  @media (max-width: 780px) { .steps { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 480px) { .steps { grid-template-columns: 1fr; } }
  .step-num { width: 28px; height: 28px; border-radius: 999px; background: var(--text); color: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 700; }
  .step h4 { font-size: 14.5px; margin: 10px 0 4px; }
  .step p { font-size: 13px; color: var(--text-muted); line-height: 1.5; }

  /* ---- Certificate visual (mirrors generate-pdf.ts layout) ---- */
  .cert-frame {
    border: 2px solid var(--brand); border-radius: 4px; padding: 6px; background: var(--bg-raised);
  }
  .cert-inner {
    border: 1px solid var(--border); border-radius: 2px; padding: clamp(20px, 5vw, 40px) 24px;
    text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center;
  }
  .cert-institute { color: var(--brand); font-weight: 700; font-size: 13px; letter-spacing: 0.06em; }
  .cert-title { font-size: clamp(20px, 4vw, 26px); font-weight: 700; letter-spacing: -0.01em; margin-top: 4px; }
  .cert-sub { color: var(--text-muted); font-size: 13px; margin-top: 6px; }
  .cert-name { font-size: clamp(20px, 4vw, 26px); font-weight: 700; margin-top: 2px; }
  .cert-course { font-weight: 700; font-size: 16px; margin-top: 4px; }
  .cert-date { color: var(--text-muted); font-size: 12.5px; }
  .cert-code { margin-top: 14px; font-weight: 700; font-size: 13px; }
  .cert-verify { color: var(--text-muted); font-size: 11.5px; }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; font-weight: 500; color: var(--text-muted); font-size: 12px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
  td { padding: 12px 14px; border-bottom: 1px solid var(--border-soft); }
  tr:last-child td { border-bottom: none; }

  .kv { display: grid; grid-template-columns: 1fr; gap: 4px; }
  .kv dt { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-faint); }
  .kv dd { margin: 0; font-size: 14px; }

  footer.site-footer { text-align: center; padding: 32px 16px 40px; color: var(--text-faint); font-size: 12.5px; border-top: 1px solid var(--border); margin-top: 24px; }

  /* =====================================================================
     REDESIGN v2 — motion system, buttons v2, toasts, reveals, FAQ, stats
     ===================================================================== */
  .btn { position: relative; overflow: hidden; transition: transform .12s ease, background .15s ease, border-color .15s ease, color .15s ease, box-shadow .22s ease; }
  .btn:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; box-shadow: none; }
  .btn:not([disabled]):hover { box-shadow: 0 6px 16px rgba(99,102,241,.22); transform: translateY(-1px); }
  .btn-outline:not([disabled]):hover, .btn-ghost:not([disabled]):hover { box-shadow: 0 4px 10px rgba(15,23,42,.10); }
  .btn:not([disabled]):active { transform: translateY(0) scale(.96); box-shadow: none; }
  .btn-lg { height: 48px; padding: 0 28px; font-size: 15px; border-radius: 10px; }
  .ripple { position: absolute; border-radius: 50%; background: currentColor; opacity: .18; transform: scale(0); animation: ripple .55s ease-out forwards; pointer-events: none; }
  @keyframes ripple { to { transform: scale(3); opacity: 0; } }
  .btn .spinner { width: 16px; height: 16px; flex: none; border-radius: 50%; border: 2px solid rgba(255,255,255,.35); border-top-color: #fff; animation: spin .7s linear infinite; }
  .btn-outline .spinner, .btn-ghost .spinner { border-color: color-mix(in srgb, var(--text) 25%, transparent); border-top-color: var(--brand); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .btn-loading { pointer-events: none; }

  /* checkmark draw */
  .checkmark-circle { stroke-dasharray: 157; stroke-dashoffset: 157; animation: draw-stroke .55s ease-out forwards; }
  .checkmark-check { stroke-dasharray: 60; stroke-dashoffset: 60; animation: draw-stroke .35s .5s ease-out forwards; }
  @keyframes draw-stroke { to { stroke-dashoffset: 0; } }
  .result-pop { animation: pop-in .5s cubic-bezier(.2,1.3,.4,1) both; }
  @keyframes pop-in { from { opacity: 0; transform: scale(.93) translateY(10px); } to { opacity: 1; transform: none; } }
  .shake-in { animation: shake-in .45s ease-out both; }
  @keyframes shake-in { 0% { opacity: 0; transform: translateX(-10px); } 40% { transform: translateX(6px); } 70% { transform: translateX(-3px); } 100% { opacity: 1; transform: none; } }

  /* skeleton + scan */
  .skeleton { background: linear-gradient(90deg, var(--border-soft) 25%, var(--border) 45%, var(--border-soft) 65%); background-size: 220% 100%; animation: shimmer 1.3s linear infinite; border-radius: 8px; }
  @keyframes shimmer { to { background-position: -220% 0; } }
  .verify-scan { position: relative; overflow: hidden; }
  .scan-line { position: absolute; left: 0; right: 0; top: -30%; height: 30%; background: linear-gradient(to bottom, transparent, color-mix(in srgb, var(--brand) 18%, transparent), transparent); animation: scan 1.6s ease-in-out infinite; pointer-events: none; }
  @keyframes scan { 0% { top: -30%; } 100% { top: 110%; } }
  .pulse-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--brand); animation: pulse-dot 1.2s ease-in-out infinite; display: inline-block; vertical-align: -1px; margin-right: 8px; }
  @keyframes pulse-dot { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.5); opacity: .5; } }

  /* reveal on scroll */
  .reveal { opacity: 0; transform: translateY(24px); transition: opacity .6s ease-out, transform .6s cubic-bezier(.2,.7,.3,1); }
  .reveal.visible { opacity: 1; transform: none; }
  .reveal-d1 { transition-delay: .08s; } .reveal-d2 { transition-delay: .16s; } .reveal-d3 { transition-delay: .24s; }

  /* toast */
  #toastRoot { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%); z-index: 200; display: flex; flex-direction: column; gap: 10px; align-items: center; pointer-events: none; }
  .toast { display: flex; align-items: center; gap: 10px; background: #0f172a; color: #f8fafc; padding: 12px 18px; border-radius: 12px; font-size: 13.5px; font-weight: 500; box-shadow: 0 12px 32px rgba(2,6,23,.35); animation: toast-in .32s cubic-bezier(.2,1.2,.4,1) both; max-width: min(92vw, 440px); }
  .toast.success { background: #15803d; } .toast.error { background: #b91c1c; }
  .toast .toast-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }
  .toast.out { animation: toast-out .25s ease-in both; }
  @keyframes toast-in { from { opacity: 0; transform: translateY(18px) scale(.95); } to { opacity: 1; transform: none; } }
  @keyframes toast-out { to { opacity: 0; transform: translateY(12px); } }

  /* cards + stats */
  .card-hover { transition: transform .22s ease, box-shadow .28s ease; }
  .card-hover:hover { transform: translateY(-4px); box-shadow: 0 14px 30px rgba(15,23,42,.10); }
  a.card-hover { display: block; text-decoration: none; color: inherit; }
  .stat-card .stat-ic { width: 38px; height: 38px; border-radius: 10px; background: var(--brand-soft); color: var(--brand); display: flex; align-items: center; justify-content: center; margin-bottom: 12px; }
  .stat-num { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat-label { color: var(--text-muted); font-size: 13px; margin-top: 4px; }
  .stats-band { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px,1fr)); gap: 14px; padding: 42px 0; }
  .stat { text-align: center; }
  .stat .stat-num { font-size: 38px; }

  /* faq */
  .faq-item { border-bottom: 1px solid var(--border-soft); }
  .faq-q { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; background: none; border: none; padding: 18px 4px; font-size: 15px; font-weight: 600; color: var(--text); cursor: pointer; font-family: inherit; text-align: left; }
  .faq-q svg { transition: transform .25s ease; color: var(--text-muted); flex: none; }
  .faq-item.open .faq-q svg { transform: rotate(180deg); }
  .faq-a { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .32s ease; }
  .faq-item.open .faq-a { grid-template-rows: 1fr; }
  .faq-a-inner { overflow: hidden; }
  .faq-a-inner p { margin: 0; padding: 0 4px 20px; color: var(--text-muted); font-size: 14px; line-height: 1.65; }

  /* Pricing */
  .pricing-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:18px; margin-top:28px; text-align:left; }
  @media (max-width:720px){ .pricing-grid { grid-template-columns:1fr; } }
  .plan { display:flex; flex-direction:column; padding:26px; position:relative; }
  .plan-pop { border:2px solid var(--brand); box-shadow:0 12px 32px rgba(59,130,246,.16); }
  .plan-tag { position:absolute; top:-13px; left:50%; transform:translateX(-50%); background:var(--brand); color:#fff; font-size:12px; font-weight:700; padding:4px 14px; border-radius:999px; white-space:nowrap; }
  .plan-name { font-size:15px; font-weight:700; }
  .plan-price { font-size:32px; font-weight:800; margin:8px 0 2px; letter-spacing:-.02em; }
  .plan-per { font-size:12.5px; color:var(--text-faint); margin-bottom:14px; }
  .plan ul { list-style:none; margin:0 0 20px; padding:0; display:flex; flex-direction:column; gap:9px; font-size:13.5px; color:var(--text-muted); }
  .plan ul li { display:flex; gap:8px; align-items:flex-start; }
  .plan ul svg { width:16px; height:16px; flex:none; color:var(--ok); margin-top:2px; }
  .plan .btn { margin-top:auto; }

  /* footer */
  .site-footer-rich { border-top: 1px solid var(--border); margin-top: 32px; background: var(--bg-subtle); }
  .footer-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr; gap: 28px; padding: 44px 0 28px; }
  @media (max-width: 640px) { .footer-grid { grid-template-columns: 1fr 1fr; } }
  .footer-grid h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-faint); margin: 0 0 12px; }
  .footer-grid a { display: block; color: var(--text-muted); font-size: 13.5px; text-decoration: none; margin-bottom: 9px; }
  .footer-grid a:hover { color: var(--brand); }
  .footer-bottom { border-top: 1px solid var(--border); padding: 18px 0; text-align: center; color: var(--text-faint); font-size: 12.5px; }

  /* verify page extras */
  .verify-qr { background: #fff; padding: 10px; border-radius: 12px; border: 1px solid var(--border); display: inline-block; }
  .anti-fraud { display: flex; gap: 10px; align-items: flex-start; background: var(--warning-soft); border: 1px solid color-mix(in srgb, var(--warning) 30%, transparent); border-radius: 10px; padding: 12px 14px; font-size: 12.5px; line-height: 1.6; margin-top: 18px; text-align: left; color: var(--text); }
  .verify-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 20px; }

  /* confetti */
  .confetti-piece { position: fixed; width: 8px; height: 13px; z-index: 150; border-radius: 2px; pointer-events: none; animation: confetti-fall 1.9s ease-in forwards; }
  @keyframes confetti-fall { to { transform: translateY(62vh) rotate(560deg); opacity: 0; } }

  /* modal pop */
  .modal-box { animation: modal-pop .28s cubic-bezier(.2,1.2,.4,1) both; }
  @keyframes modal-pop { from { opacity: 0; transform: scale(.94) translateY(10px); } to { opacity: 1; transform: none; } }

  @media print {
    .topbar, .no-print, #toastRoot, .demo-chip { display: none !important; }
    body { background: #fff; }
  }
  @media (prefers-reduced-motion: reduce) {
    .reveal { opacity: 1; transform: none; transition: none; }
    .screen.active, .blob, .float-icon, .scan-line, .skeleton, .pulse-dot,
    .checkmark-circle, .checkmark-check, .result-pop, .shake-in, .modal-box,
    .confetti-piece, .toast, .ripple { animation: none !important; }
    .checkmark-circle, .checkmark-check { stroke-dashoffset: 0; }
    .btn, .card-hover, .faq-a { transition: none; }
    .card-hover:hover { transform: none; }
  }
</style>

<div class="topbar">
  <button class="brand-mark" onclick="nav('/')"><span class="dot"></span>Certivo</button>

const G18 =

function getBCHDigit(data) {

    }

      else if (v < 8) this.modules[v + 1][8] = mod;
      else this.modules[this.moduleCount - 15 + v][8] = mod;
    }
    for (let h = 0; h < 15; h++) {
      const mod = !test && ((bits >> h) & 1) === 1;
      if (h < 8) this.modules[8][this.moduleCount - h - 1] = mod;
      else if (h < 9) this.modules[8][15 - h - 1 + 1] = mod;
      else this.modules[8][15 - h - 1] = mod;
    }
    this.modules[this.moduleCount - 8][8] = !test;
  }

  mapData(data, maskPattern) {
    let inc = -1;
    let row = this.moduleCount - 1;
    let bitIndex = 7;
    let byteIndex = 0;

    for (let col = this.moduleCount - 1; col > 0; col -= 2) {
      if (col === 6) col--;
      while (true) {
        for (let c = 0; c < 2; c++) {
          if (this.modules[row][col - c] === null) {
            let dark = false;
            if (byteIndex < data.length) {
              dark = ((data[byteIndex] >>> bitIndex) & 1) === 1;
            }
            const mask = getMask(maskPattern, row, col - c);
            if (mask) dark = !dark;
            this.modules[row][col - c] = dark;
            bitIndex--;
            if (bitIndex === -1) {
              byteIndex++;
              bitIndex = 7;
            }
          }
        }
        row += inc;
        if (row < 0 || this.moduleCount <= row) {
          row -= inc;
          inc = -inc;
          break;
        }
      }
    }
  }

  makeImpl(test, maskPattern, dataCache) {
    this.moduleCount = this.typeNumber * 4 + 17;
    this.modules = new Array(this.moduleCount);
    for (let row = 0; row < this.moduleCount; row++) {
      this.modules[row] = new Array(this.moduleCount).fill(null);
    }

    this.setupPositionProbePattern(0, 0);
    this.setupPositionProbePattern(this.moduleCount - 7, 0);
    this.setupPositionProbePattern(0, this.moduleCount - 7);
    this.setupPositionAdjustPattern();
    this.setupTimingPattern();
    this.setupTypeInfo(test, maskPattern);
    if (this.typeNumber >= 7) this.setupTypeNumber(test);
    this.mapData(dataCache, maskPattern);
  }

  getLostPoint() {
    const moduleCount = this.moduleCount;
    let lostPoint = 0;

    for (let row = 0; row < moduleCount; row++) {
      for (let col = 0; col < moduleCount; col++) {
        let sameCount = 0;
        const dark = this.isDark(row, col);
        for (let r = -1; r <= 1; r++) {
          if (row + r < 0 || moduleCount <= row + r) continue;
          for (let c = -1; c <= 1; c++) {
            if (col + c < 0 || moduleCount <= col + c) continue;
            if (r === 0 && c === 0) continue;
            if (dark === this.isDark(row + r, col + c)) sameCount++;
          }
        }
        if (sameCount > 5) lostPoint += 3 + sameCount - 5;
      }
    }

    for (let row = 0; row < moduleCount - 1; row++) {
      for (let col = 0; col < moduleCount - 1; col++) {
        let count = 0;
        if (this.isDark(row, col)) count++;
        if (this.isDark(row + 1, col)) count++;
        if (this.isDark(row, col + 1)) count++;
        if (this.isDark(row + 1, col + 1)) count++;
        if (count === 0 || count === 4) lostPoint += 3;
      }
    }

    for (let row = 0; row < moduleCount; row++) {
      for (let col = 0; col < moduleCount - 6; col++) {
        if (
          this.isDark(row, col) &&
          !this.isDark(row, col + 1) &&
          this.isDark(row, col + 2) &&
          this.isDark(row, col + 3) &&
          this.isDark(row, col + 4) &&
          !this.isDark(row, col + 5) &&
          this.isDark(row, col + 6)
        ) {
          lostPoint += 40;
        }
      }
    }
    for (let col = 0; col < moduleCount; col++) {
      for (let row = 0; row < moduleCount - 6; row++) {
        if (
          this.isDark(row, col) &&
          !this.isDark(row + 1, col) &&
          this.isDark(row + 2, col) &&
          this.isDark(row + 3, col) &&
          this.isDark(row + 4, col) &&
          !this.isDark(row + 5, col) &&
          this.isDark(row + 6, col)
        ) {
          lostPoint += 40;
        }
      }
    }

    let darkCount = 0;
    for (let col = 0; col < moduleCount; col++) {
      for (let row = 0; row < moduleCount; row++) {
        if (this.isDark(row, col)) darkCount++;
      }
    }
    const ratio = Math.abs((100 * darkCount) / moduleCount / moduleCount - 50) / 5;
    lostPoint += ratio * 10;

    return lostPoint;
  }

  make(dataBytes) {
    const dataCache = createData(this.typeNumber, this.rsRowOffset, dataBytes);

    let minLostPoint = 0;
    let bestPattern = 0;
    for (let i = 0; i < 8; i++) {
      this.makeImpl(true, i, dataCache);
      const lostPoint = this.getLostPoint();
      if (i === 0 || minLostPoint > lostPoint) {
        minLostPoint = lostPoint;
        bestPattern = i;
      }
    }
    this.makeImpl(false, bestPattern, dataCache);
  }
}

/**
 * Encodes `text` into a QR code module matrix at the smallest version
 * that fits, for the given error-correction level ("L"|"M"|"Q"|"H").
 * Returns { size, isDark(row, col) }.
 */
function generateQrMatrix(text, ecLevel) {
  ecLevel = ecLevel || "M";
  const formatInfoBits = FORMAT_INFO_BITS[ecLevel];
  const rsRowOffset = RS_BLOCK_ROW_OFFSET[ecLevel];
  const bytes = [];
  for (let i = 0; i < text.length; i++) bytes.push(text.charCodeAt(i) & 0xff);

  let typeNumber = -1;
  for (let t = 1; t <= 40; t++) {
    const rsBlocks = getRSBlocks(t, rsRowOffset);
    let totalDataCount = 0;
    for (const b of rsBlocks) totalDataCount += b.dataCount;
    const headerBits = 4 + getLengthInBits(t);
    const neededBits = headerBits + bytes.length * 8;
    if (neededBits <= totalDataCount * 8) {
      typeNumber = t;
      break;
    }
  }
  if (typeNumber === -1) {
    throw new Error(`Text too long to encode as a QR code (${bytes.length} bytes).`);
  }

  const builder = new QrCodeBuilder(typeNumber, formatInfoBits, rsRowOffset);
  builder.make(bytes);

  return {
    size: builder.moduleCount,
    isDark: (row, col) => builder.isDark(row, col),
  };
}

/* =========================================================================
   Plain-JS port of src/server/certificates/generate-pdf.ts — same layout,
   byte-for-byte, using the pdf-lib UMD build loaded above via <script
   src=".../pdf-lib.min.js"> (global `PDFLib`) instead of an ES import,
   and generateQrMatrix() above instead of @/lib/qrcode. Branding is read
   live from the current institute record every time a certificate is
   previewed — never cached on the student record — matching
   generate-pdf.ts's own "branding isn't a certified fact" design note.
   ========================================================================= */

// data:<mime>;base64,<data> -> Uint8Array. pdf-lib's embedPng/embedJpg
// need raw bytes, not a data: URL string.
function dataUrlToBytes(dataUrl) {
  const comma = dataUrl.indexOf(",");
  const base64 = dataUrl.slice(comma + 1);
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}

// Embeds a logo/signature image, trying the format its data: URL's mime
// prefix claims first and falling back to the other — a mislabeled
// upload shouldn't break certificate generation. Returns null (never
// throws) on anything unreadable, so a missing/corrupt image just omits
// that element instead of failing the whole PDF.
async function tryEmbedImage(doc, dataUrl) {
  if (!dataUrl) return null;
  let mimeType = "";
  const match = /^data:([^;]+);base64,/.exec(dataUrl);
  if (match) mimeType = match[1];
  let bytes;
  try {
    bytes = dataUrlToBytes(dataUrl);
  } catch {
    return null;
  }
  const attempts =
    mimeType === "image/png"
      ? [() => doc.embedPng(bytes), () => doc.embedJpg(bytes)]
      : [() => doc.embedJpg(bytes), () => doc.embedPng(bytes)];
  for (const attempt of attempts) {
    try {
      return await attempt();
    } catch {
      // try the next format
    }
  }
  return null;
}

/** Draws a QR matrix as a grid of filled squares — no image encoding. */
function drawQrCode(page, text, opts) {
  const matrix = generateQrMatrix(text, "M");
  const moduleSize = opts.size / matrix.size;
  for (let row = 0; row < matrix.size; row++) {
    for (let col = 0; col < matrix.size; col++) {
      if (matrix.isDark(row, col)) {
        page.drawRectangle({
          // QR row 0 is the TOP of the code; PDF y grows upward, so flip
          // the row index when mapping into page coordinates.
          x: opts.x + col * moduleSize,
          y: opts.y + (matrix.size - 1 - row) * moduleSize,
          width: moduleSize,
          height: moduleSize,
          color: opts.color,
        });
      }
    }
  }
}

/** width/height for `image` scaled to fit inside a maxW x maxH box, preserving aspect ratio. */
function fitImage(image, maxW, maxH) {
  const scale = Math.min(maxW / image.width, maxH / image.height, 1);
  const upscale = Math.min(maxW / image.width, maxH / image.height);
  const s = image.width * upscale <= maxW && image.height * upscale <= maxH ? upscale : scale;
  return { width: image.width * s, height: image.height * s };
}

/**
 * Builds the certificate PDF and returns its bytes (Uint8Array). `input`
 * fields mirror the real app's CertificatePdfInput: code, studentName,
 * instituteName, courseName, completionDate (Date|null), issuedAt (Date),
 * verifyUrl, plus optional branding: logoDataUrl, tagline, website,
 * contactEmail, addressLine, centreHeadName, centreHeadSignatureDataUrl,
 * authorityName, authoritySignatureDataUrl.
 */
async function generateCertificatePdfBytes(input) {
  const { PDFDocument, StandardFonts, rgb } = PDFLib;
  const doc = await PDFDocument.create();
  doc.setTitle(`Certificate — ${input.studentName}`);
  doc.setProducer("Certivo");

  const page = doc.addPage([842, 595]); // A4 landscape, points
  const { width, height } = page.getSize();

  const bold = await doc.embedFont(StandardFonts.HelveticaBold);
  const regular = await doc.embedFont(StandardFonts.Helvetica);
  const oblique = await doc.embedFont(StandardFonts.HelveticaOblique);
  const nameFont = await doc.embedFont(StandardFonts.TimesRomanBoldItalic);

  const ink = rgb(0.06, 0.09, 0.16);
  const muted = rgb(0.39, 0.45, 0.55);
  const faint = rgb(0.58, 0.64, 0.72);
  const accent = rgb(0.31, 0.27, 0.9);
  const border = rgb(0.85, 0.87, 0.92);

  page.drawRectangle({
    x: 24, y: 24, width: width - 48, height: height - 48,
    borderColor: accent, borderWidth: 2,
  });
  page.drawRectangle({
    x: 34, y: 34, width: width - 68, height: height - 68,
    borderColor: muted, borderWidth: 0.75,
  });

  const MARGIN = 70;
  const MIN_SIZE = 8;
  const centerText = (text, y, font, size, color) => {
    font = font || regular;
    size = size || 12;
    color = color || ink;
    const maxWidth = width - MARGIN * 2;
    let fitSize = size;
    let textWidth = font.widthOfTextAtSize(text, fitSize);
    if (textWidth > maxWidth) {
      fitSize = Math.max(MIN_SIZE, size * (maxWidth / textWidth));
      textWidth = font.widthOfTextAtSize(text, fitSize);
    }
    page.drawText(text, { x: (width - textWidth) / 2, y, size: fitSize, font, color });
    return fitSize;
  };

  // --- Header: logo (top-left) + institute name/tagline/contact (centered) ---
  const logoImage = await tryEmbedImage(doc, input.logoDataUrl);
  if (logoImage) {
    const box = fitImage(logoImage, 64, 64);
    page.drawImage(logoImage, { x: 56, y: height - 56 - box.height, width: box.width, height: box.height });
  }

  centerText(input.instituteName.toUpperCase(), height - 62, bold, 19, accent);

  let headerY = height - 82;
  if (input.tagline) {
    centerText(input.tagline, headerY, oblique, 10, muted);
    headerY -= 15;
  }
  const contactParts = [input.website, input.contactEmail, input.addressLine].filter((p) => Boolean(p && p.trim()));
  if (contactParts.length > 0) {
    centerText(contactParts.join("   ·   "), headerY, regular, 9, faint);
    headerY -= 14;
  }

  page.drawLine({ start: { x: 90, y: headerY - 4 }, end: { x: width - 90, y: headerY - 4 }, thickness: 0.75, color: border });

  // --- Body: title, student name, course ---
  centerText("CERTIFICATE OF COMPLETION", height - 155, bold, 26, ink);
  centerText("This is to certify that", height - 190, regular, 13, muted);
  centerText(input.studentName, height - 230, nameFont, 30, ink);
  centerText("has successfully completed the course", height - 265, regular, 13, muted);
  centerText(input.courseName, height - 297, bold, 20, ink);

  if (input.completionDate) {
    centerText(
      `Completed on ${input.completionDate.toLocaleDateString("en-IN", { year: "numeric", month: "long", day: "numeric" })}`,
      height - 328, regular, 12, muted,
    );
  }

  // --- Info strip: Certificate ID | Issue Date ---
  const infoLabelValue = (label, value, boxX, boxW) => {
    page.drawRectangle({ x: boxX, y: 148, width: boxW, height: 40, borderColor: border, borderWidth: 1 });
    const labelSize = 8;
    const labelWidth = regular.widthOfTextAtSize(label, labelSize);
    page.drawText(label, { x: boxX + (boxW - labelWidth) / 2, y: 148 + 27, size: labelSize, font: regular, color: faint });
    let valueSize = 12;
    let valueWidth = bold.widthOfTextAtSize(value, valueSize);
    if (valueWidth > boxW - 16) {
      valueSize = Math.max(8, valueSize * ((boxW - 16) / valueWidth));
      valueWidth = bold.widthOfTextAtSize(value, valueSize);
    }
    page.drawText(value, { x: boxX + (boxW - valueWidth) / 2, y: 148 + 9, size: valueSize, font: bold, color: ink });
  };

  const infoBoxWidth = 220;
  const infoGap = 16;
  const infoTotalWidth = infoBoxWidth * 2 + infoGap;
  const infoStartX = (width - infoTotalWidth) / 2;
  infoLabelValue("CERTIFICATE ID", input.code, infoStartX, infoBoxWidth);
  infoLabelValue(
    "ISSUE DATE",
    input.issuedAt.toLocaleDateString("en-IN", { year: "numeric", month: "long", day: "numeric" }),
    infoStartX + infoBoxWidth + infoGap,
    infoBoxWidth,
  );

  // --- Footer: two signature blocks + verification QR ---
  const drawSignature = async (opts) => {
    const lineWidth = 170;
    const lineY = 72;
    const sigImage = await tryEmbedImage(doc, opts.signatureDataUrl);
    if (sigImage) {
      const box = fitImage(sigImage, lineWidth - 20, 34);
      page.drawImage(sigImage, { x: opts.centerX - box.width / 2, y: lineY + 2, width: box.width, height: box.height });
    }
    page.drawLine({ start: { x: opts.centerX - lineWidth / 2, y: lineY }, end: { x: opts.centerX + lineWidth / 2, y: lineY }, thickness: 1, color: border });
    const name = (opts.name && opts.name.trim()) || " ";
    const nameSize = 12;
    const nameWidth = bold.widthOfTextAtSize(name, nameSize);
    page.drawText(name, { x: opts.centerX - nameWidth / 2, y: lineY - 16, size: nameSize, font: bold, color: ink });
    const titleWidth = regular.widthOfTextAtSize(opts.title, 9.5);
    page.drawText(opts.title, { x: opts.centerX - titleWidth / 2, y: lineY - 29, size: 9.5, font: regular, color: muted });
  };

  await drawSignature({ centerX: 210, name: input.centreHeadName, title: "Centre Head", signatureDataUrl: input.centreHeadSignatureDataUrl });
  await drawSignature({ centerX: 460, name: input.authorityName, title: "Authority", signatureDataUrl: input.authoritySignatureDataUrl });

  const qrSize = 62;
  const qrX = width - 90 - qrSize;
  const qrY = 55;
  drawQrCode(page, input.verifyUrl, { x: qrX, y: qrY, size: qrSize, color: ink });
  const scanLabel = "SCAN TO VERIFY";
  const scanLabelSize = 7.5;
  const scanLabelWidth = bold.widthOfTextAtSize(scanLabel, scanLabelSize);
  page.drawText(scanLabel, { x: qrX + (qrSize - scanLabelWidth) / 2, y: qrY + qrSize + 6, size: scanLabelSize, font: bold, color: muted });

  centerText(`Verify at ${input.verifyUrl}`, 40, regular, 8.5, faint);

  return doc.save();
}

const ALPHABET = "0123456789ABCDEFGHJKMNPQRSTVWXYZ";

  for (let i = 0; i < len; i++) s += ALPHABET[Math.floor(Math.random() * ALPHABET.length)];
  return s;
}

}
// D3/D4: client-side email pattern mirrors isValidEmail's regex above, and
// every date-of-birth/completion-date field gets max=today — a value like
// "admin@localhost" or a future date used to only get rejected AFTER
// submit; both are now caught by the browser's own validation first.
const EMAIL_PATTERN_ATTR = 'pattern="[^\\s@]+@[^\\s@]+\\.[^\\s@]+" title="Enter a valid email address"';

// parseOptionalPastOrTodayDate — a malformed fee amount or a date typed
// directly into the field (bypassing the HTML max=today above) is
// rejected with a clean message instead of silently producing NaN paise
// or an unchecked future date on the certificate.
function parseOptionalRupeesToPaise(raw, label) {
  if (!raw) return { paise: null };
  const rupees = Number(raw);
  if (!Number.isFinite(rupees) || rupees < 0) {
    return { error: `${label} must be a valid, non-negative amount.` };
  }
  return { paise: paise(rupees) };
}
function validateNotFutureDate(raw, label) {
  if (!raw) return {};
  const d = new Date(raw);
  if (Number.isNaN(d.getTime())) return { error: `${label} isn't a valid date.` };
  if (d.getTime() > new Date(todayIso() + "T23:59:59").getTime()) {
    return { error: `${label} can't be in the future.` };
  }
  return {};
}
/* Official LinkedIn "Add to profile" deep-link for a certification. */

    if (file.size > maxBytes) {
      reject(new Error(`That image is ${formatBytes(file.size)} — please choose one under ${formatBytes(maxBytes)}.`));
      return;
    }
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(new Error("Couldn't read that file — please try a different image."));
    reader.readAsDataURL(file);

function jsq(str) { return String(str == null ? "" : str).replace(/\\/g, "\\\\").replace(/'/g, "\\'"); }

function toast(msg, type) {
  const root = document.getElementById("toastRoot");
  if (!root) return;
  const el = document.createElement("div");
  el.className = "toast" + (type ? " " + type : "");
  el.innerHTML = `<span class="toast-dot" aria-hidden="true"></span><span></span>`;
  el.lastChild.textContent = msg;
  root.appendChild(el);
  setTimeout(() => { el.classList.add("out"); setTimeout(() => el.remove(), 260); }, 2600);
}
function copyText(text, msg) {
  const done = () => toast(msg || "Copied to clipboard", "success");
  const fallback = () => {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); done(); }
    catch (e) { toast("Copy didn't work — long-press to copy manually", "error"); }
    ta.remove();
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(fallback);
  else fallback();
}
function setBtnLoading(btn, on) {

    btn.classList.add("btn-loading"); btn.disabled = true;

  } else {

/* Ripple on every .btn press (delegated, works for dynamically rendered HTML) */
document.addEventListener("pointerdown", (e) => {
  const btn = e.target.closest ? e.target.closest(".btn") : null;
  if (!btn || btn.disabled) return;
  const r = btn.getBoundingClientRect();
  const d = Math.max(r.width, r.height) * 1.1;
  const s = document.createElement("span");
  s.className = "ripple";
  s.style.width = s.style.height = d + "px";
  s.style.left = (e.clientX - r.left - d / 2) + "px";
  s.style.top = (e.clientY - r.top - d / 2) + "px";
  btn.appendChild(s);
  setTimeout(() => s.remove(), 600);
});

/* Reveal-on-scroll */
let revealObserver = null;
function initReveals() {
  const els = document.querySelectorAll(".reveal:not(.visible)");
  if (!els.length) return;
  if (!("IntersectionObserver" in window) || matchMedia("(prefers-reduced-motion: reduce)").matches) {
    els.forEach((el) => el.classList.add("visible")); return;
  }
  if (!revealObserver) revealObserver = new IntersectionObserver((entries) => {
    entries.forEach((en) => { if (en.isIntersecting) { en.target.classList.add("visible"); revealObserver.unobserve(en.target); } });
  }, { threshold: 0.1 });
  els.forEach((el) => revealObserver.observe(el));
}
/* Animated counters */
let countObserver = null;
function initCountUps() {
  const els = document.querySelectorAll("[data-countup]:not([data-counted])");
  if (!els.length) return;
  const run = (el) => {
    el.dataset.counted = "1";
    const target = parseInt(el.dataset.countup, 10) || 0;
    if (matchMedia("(prefers-reduced-motion: reduce)").matches || !("requestAnimationFrame" in window)) { el.textContent = target; return; }
    const t0 = performance.now(), dur = 900;
    const step = (t) => {
      const p = Math.min(1, (t - t0) / dur);
      el.textContent = Math.round(target * (1 - Math.pow(1 - p, 3)));
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  };
  if (!("IntersectionObserver" in window)) { els.forEach(run); return; }
  if (!countObserver) countObserver = new IntersectionObserver((es) => es.forEach((en) => {
    if (en.isIntersecting) { countObserver.unobserve(en.target); run(en.target); }
  }), { threshold: 0.4 });
  els.forEach((el) => countObserver.observe(el));
}

/* ---- Verification sharing ---- */
function verifyUrlFor(code) {
  const base = (location.origin && location.origin !== "null") ? location.origin : "";
  return base + location.pathname + "#/v/" + encodeURIComponent(code);
}
function shareVerify(code, name) {
  const url = verifyUrlFor(code);
  const text = `Verify ${name}'s certificate: ${url}`;
  if (navigator.share) navigator.share({ title: "Certificate verification", text, url }).catch(() => {});
  else copyText(url, "Verification link copied — share it anywhere");
}
function shareWhatsApp(code, name) {
  window.open("https://wa.me/?text=" + encodeURIComponent(`Verify certificate ${code} (${name}): ${verifyUrlFor(code)}`), "_blank", "noopener");
}
function shareLinkedIn(code) {
  window.open("https://www.linkedin.com/sharing/share-offsite/?url=" + encodeURIComponent(verifyUrlFor(code)), "_blank", "noopener");
}
function shareEmail(code, name) {

/* Real QR (uses the demo's dependency-free encoder) for the verify page */
function qrSvg(text, px) {
  try {
    const m = generateQrMatrix(text, "M");
    const n = m.size, cell = px / n;
    let rects = "";
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++)
      if (m.isDark(r, c)) rects += `<rect x="${(c * cell).toFixed(2)}" y="${(r * cell).toFixed(2)}" width="${(cell + 0.03).toFixed(2)}" height="${(cell + 0.03).toFixed(2)}"/>`;
    return `<svg viewBox="0 0 ${px} ${px}" width="${px}" height="${px}" role="img" aria-label="QR code linking to this verification page" style="display:block;">${rects}</svg>`;
  } catch (e) { return ""; }
}
/* Generate + download the real certificate PDF (public verify page) */
async function downloadVerifyPdf(btn, code) {
  const s = db.students.find((x) => x.certificateCode === code && x.certificateStatus === "ACTIVE");
  if (!s) { toast("No active certificate to download", "error"); return; }
  setBtnLoading(btn, true);
  try {
    const inst = db.institutes.find((i) => i.id === s.instituteId);
    const bytes = await generateCertificatePdfBytes(buildCertificatePdfInput(s, inst));
    const url = URL.createObjectURL(new Blob([bytes], { type: "application/pdf" }));
    const a = document.createElement("a");
    a.href = url; a.download = `certificate-${code}.pdf`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    toast("Certificate PDF downloaded", "success");
  } catch (err) { toast("Couldn't generate the PDF right now", "error"); }
  setBtnLoading(btn, false);

/* Minimal CSV parser: quoted cells, embedded commas/quotes, BOM-tolerant */
function parseCsvText(text) {
  const rows = []; let row = [], cell = "", inQ = false;
  const t = String(text).replace(/^\ufeff/, "");
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (inQ) {
      if (c === '"') { if (t[i + 1] === '"') { cell += '"'; i++; } else inQ = false; }
      else cell += c;
    }
    else if (c === '"') inQ = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && t[i + 1] === "\n") i++;
      row.push(cell); rows.push(row); row = []; cell = "";
    }
    else cell += c;
  }
  row.push(cell); rows.push(row);
  return rows.filter((r) => r.length > 1 || r[0].trim() !== "");
}

/* Step 2: parse + validate every row with the same rules as the single-register form */
function onBulkFileSelected(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const grid = parseCsvText(reader.result || "");
      if (grid.length < 2) { toast("That file looks empty — download the template first", "error"); return; }
      const header = grid[0].map((h) => h.trim());
      const missing = BULK_COLUMNS.filter((c) => !header.includes(c));
      if (missing.length) { toast("Missing columns: " + missing.join(", "), "error"); return; }
      const idx = {}; BULK_COLUMNS.forEach((c) => { idx[c] = header.indexOf(c); });
      bulkRows = grid.slice(1).map((cells) => {
        const d = {}; BULK_COLUMNS.forEach((c) => { d[c] = (cells[idx[c]] || "").trim(); });
        const errors = [];
        if (!d["Full name"]) errors.push("Full name required");
        if (!d["Course"]) errors.push("Course required");
        if (d["Email"] && !isValidEmail(d["Email"])) errors.push("Invalid email");
        if (d["Phone"] && !isValidIndianMobile(d["Phone"])) errors.push("Phone must be a 10-digit Indian mobile");
        const dob = validateNotFutureDate(d["Date of birth"], "Date of birth"); if (dob.error) errors.push(dob.error);
        const comp = validateNotFutureDate(d["Completion date"], "Completion date"); if (comp.error) errors.push(comp.error);

        const rf = parseOptionalRupeesToPaise(d["Registration fee (INR)"], "Registration fee"); if (rf.error) errors.push(rf.error);
        return { data: d, errors, ok: errors.length === 0, regFeePaise: rf.paise, certFeePaise: cf.paise };
      });
      bulkResult = null;
      render();
      const ok = bulkRows.filter((r) => r.ok).length;
      toast(`${ok} of ${bulkRows.length} rows ready` + (ok < bulkRows.length ? " — fix the rest or issue the valid ones" : ""), ok ? "success" : "error");
    } catch (err) { toast("Couldn't read that file — is it a valid CSV?", "error"); }
  };
  reader.readAsText(file);
  input.value = "";
}

/* Step 3: issue every valid row — same record shape as onRegisterStudent() */
function onBulkIssue() {
  const good = bulkRows.filter((r) => r.ok);
  if (!good.length) return;
  const issued = [];
  for (const r of good) {
    const d = r.data;
    const code = generateUniqueStudentCode();
    const tempPassword = randomCode(10);
    const certCode = `${CERT_PREFIX}-${new Date().getFullYear()}-${randomCode(10)}`;
    db.students.push({
      id: "s" + (db.nextSeq++), instituteId: session.instituteId,
      code, password: tempPassword,
      fullName: d["Full name"], email: d["Email"] || null, phone: d["Phone"] || null,
      dateOfBirth: d["Date of birth"] || null, gender: d["Gender"] || null,
      guardianName: d["Guardian name"] || null,
      addressLine1: d["Address line 1"] || null, city: d["City"] || null,
      state: d["State"] || null, pincode: d["Pincode"] || null,
      courseName: d["Course"], completionDate: d["Completion date"] || todayIso(),
      registrationFeePaise: r.regFeePaise, registrationFeePaid: false,
      certificateCode: certCode, certificateStatus: "ACTIVE",
      certificateRevokedReason: null, certificateRevokedAt: null,
      certificateDownloadCount: 0,
    });
    issued.push({ code, tempPassword, fullName: d["Full name"], courseName: d["Course"], certCode });
  }
  bulkResult = { issued };
  bulkRows = [];
  render();
  toast(`Issued ${issued.length} certificate${issued.length === 1 ? "" : "s"}`, "success");
}

async function onInstituteRegister(e) {
  e.preventDefault();
  const form = e.target;
  const f = new FormData(form);
  const name = (f.get("name") || "").trim();
  const ownerName = (f.get("ownerName") || "").trim();
  const ownerEmail = (f.get("ownerEmail") || "").trim();
  const ownerPhone = (f.get("ownerPhone") || "").trim();
  const addressLine1 = (f.get("addressLine1") || "").trim();
  const city = (f.get("city") || "").trim();
  const state = (f.get("state") || "").trim();
  const pincode = (f.get("pincode") || "").trim();
  const password = (f.get("password") || "").trim();
  const logoFile = f.get("logo");
  const tagline = (f.get("tagline") || "").trim() || null;
  const centreHeadName = (f.get("centreHeadName") || "").trim() || null;
  const centreHeadSignatureFile = f.get("centreHeadSignature");
  const authorityName = (f.get("authorityName") || "").trim() || null;
  const authoritySignatureFile = f.get("authoritySignature");
  const termsAccepted = f.get("termsAccepted") === "on";

  const showError = (msg) => {
    document.getElementById("app").innerHTML = `<div class="screen active">${screenInstituteRegister(msg)}</div>`;
  };

  if (!name || !ownerName || !ownerEmail || !ownerPhone || !addressLine1 || !city || !state || !pincode || !password) {
    showError("All fields are required.");
    return false;
  }
  if (!isValidEmail(ownerEmail)) { showError("That email address doesn't look valid."); return false; }
  if (!isValidIndianMobile(ownerPhone)) { showError("Phone must be a valid 10-digit mobile number."); return false; }
  if (!termsAccepted) { showError("Please accept the Terms of Service and Privacy Policy to continue."); return false; }

  let logoDataUrl = null;
  let centreHeadSignatureDataUrl = null;
  let authoritySignatureDataUrl = null;
  try {
    logoDataUrl = await readFileAsDataUrl(logoFile);
    centreHeadSignatureDataUrl = await readFileAsDataUrl(centreHeadSignatureFile);
    authoritySignatureDataUrl = await readFileAsDataUrl(authoritySignatureFile);
  } catch (err) {
    showError(err.message);
    return false;
  }

  const inst = {
    id: "inst" + db.instituteSeq++,
    name,
    slug: generateUniqueInstituteSlug(name),
    status: "PENDING",
    adminId: generateUniqueInstituteAdminId(),
    adminPassword: password,
    ownerName, ownerEmail, ownerPhone,
    addressLine1, city, state, pincode,
    logoDataUrl,
    tagline,
    centreHeadName,
    centreHeadSignatureDataUrl,
    authorityName,
    authoritySignatureDataUrl,
    termsAcceptedAt: new Date().toISOString(),
    termsVersion: "v1",
    createdAt: new Date().toISOString().slice(0, 10),
  };
  db.institutes.push(inst);
  instituteRegisterResult = inst;
  render();
  return false;
}

function confirmDeleteInstitute(id) {

async function onSaveInstituteSettings(e) {
  e.preventDefault();
  const inst = db.institutes.find((i) => i.id === session.instituteId);
  const f = new FormData(e.target);
  const ownerName = (f.get("ownerName") || "").trim();
  const ownerEmail = (f.get("ownerEmail") || "").trim();
  const ownerPhone = (f.get("ownerPhone") || "").trim();
  const addressLine1 = (f.get("addressLine1") || "").trim();
  const city = (f.get("city") || "").trim();
  const state = (f.get("state") || "").trim();
  const pincode = (f.get("pincode") || "").trim();
  const logoFile = f.get("logo");
  const tagline = (f.get("tagline") || "").trim() || null;
  const centreHeadName = (f.get("centreHeadName") || "").trim() || null;
  const centreHeadSignatureFile = f.get("centreHeadSignature");
  const authorityName = (f.get("authorityName") || "").trim() || null;
  const authoritySignatureFile = f.get("authoritySignature");
  const msgEl = document.getElementById("settingsMsg");

  if (!ownerName || !ownerEmail || !ownerPhone || !addressLine1 || !city || !state || !pincode) {
    msgEl.innerHTML = `<div class="alert alert-danger">All fields are required.</div>`;
    return false;
  }
  if (!isValidEmail(ownerEmail)) { msgEl.innerHTML = `<div class="alert alert-danger">That email address doesn't look valid.</div>`; return false; }
  if (!isValidIndianMobile(ownerPhone)) { msgEl.innerHTML = `<div class="alert alert-danger">Phone must be a valid 10-digit mobile number.</div>`; return false; }

  // Each image field is independent and optional: leaving a file input
  // untouched (size 0 — nothing chosen) keeps whatever is already saved,
  // same rule the real app's admin settings action follows.
  if (logoFile && logoFile.size > 0) {
    try {
      const dataUrl = await readFileAsDataUrl(logoFile);
      if (dataUrl) inst.logoDataUrl = dataUrl;
    } catch (err) {
      msgEl.innerHTML = `<div class="alert alert-danger">${err.message}</div>`;
      return false;
    }
  }
  if (centreHeadSignatureFile && centreHeadSignatureFile.size > 0) {
    try {
      const dataUrl = await readFileAsDataUrl(centreHeadSignatureFile);
      if (dataUrl) inst.centreHeadSignatureDataUrl = dataUrl;
    } catch (err) {
      msgEl.innerHTML = `<div class="alert alert-danger">${err.message}</div>`;
      return false;
    }
  }
  if (authoritySignatureFile && authoritySignatureFile.size > 0) {
    try {
      const dataUrl = await readFileAsDataUrl(authoritySignatureFile);
      if (dataUrl) inst.authoritySignatureDataUrl = dataUrl;
    } catch (err) {
      msgEl.innerHTML = `<div class="alert alert-danger">${err.message}</div>`;
      return false;
    }
  }
  inst.ownerName = ownerName;
  inst.ownerEmail = ownerEmail;
  inst.ownerPhone = ownerPhone;
  inst.addressLine1 = addressLine1;
  inst.city = city;
  inst.state = state;
  inst.pincode = pincode;
  inst.tagline = tagline;
  inst.centreHeadName = centreHeadName;
  inst.authorityName = authorityName;
  settingsSavedFlash = true;
  render();
  return false;
}

function getFilteredStudents() {
  const input = document.getElementById("studentSearch");
  const q = (input?.value || "").trim().toLowerCase();
  const mine = db.students.filter((s) => s.instituteId === session.instituteId);
  return q
    ? mine.filter((s) => s.fullName.toLowerCase().includes(q) || s.code.toLowerCase().includes(q))
    : mine;
}
// Updates the table body + pagination footer directly, without a full
// render() — a full re-render on every keystroke would rebuild the search
// input itself and drop focus/cursor position mid-type.
function updateStudentsList() {
  const filtered = getFilteredStudents();
  const totalPages = Math.max(1, Math.ceil(filtered.length / STUDENTS_PAGE_SIZE));
  studentsPage = Math.min(Math.max(1, studentsPage), totalPages);
  const pageItems = filtered.slice((studentsPage - 1) * STUDENTS_PAGE_SIZE, studentsPage * STUDENTS_PAGE_SIZE);
  const body = document.getElementById("studentsTableBody");
  if (body) body.innerHTML = renderAdminStudentRows(pageItems);
  const pager = document.getElementById("studentsPagination");
  if (pager) pager.innerHTML = renderStudentsPagination(filtered.length, totalPages);
}
function filterAdminStudents() {
  studentsPage = 1; // a new search always starts back at page 1
  updateStudentsList();
}
function changeStudentsPage(delta) {
  studentsPage += delta;
  updateStudentsList();
}

function onRegisterStudent(e) {
  e.preventDefault();
  const f = new FormData(e.target);
  const fullName = (f.get("fullName") || "").trim();
  const courseName = (f.get("courseName") || "").trim();
  const email = (f.get("email") || "").trim();
  const phone = (f.get("phone") || "").trim();
  if (!fullName || !courseName) {
    document.getElementById("regError").innerHTML = `<div class="alert alert-danger">Full name and course are required.</div>`;
    return false;
  }
  if (email && !isValidEmail(email)) {
    document.getElementById("regError").innerHTML = `<div class="alert alert-danger">That email address doesn't look valid.</div>`;
    return false;
  }
  if (phone && !isValidIndianMobile(phone)) {
    document.getElementById("regError").innerHTML = `<div class="alert alert-danger">Phone must be a valid 10-digit mobile number.</div>`;
    return false;
  }
  // B4/D4: validate fee amounts and dates before anything is created —
  // matches the real app's registerStudent (parseOptionalRupeesToPaise /
  // parseOptionalPastOrTodayDate).
  const regFeeResult = parseOptionalRupeesToPaise(f.get("registrationFeeRupees"), "Registration fee");
  const dobResult = validateNotFutureDate(f.get("dateOfBirth"), "Date of birth");
  const completionResult = validateNotFutureDate(f.get("completionDate"), "Completion date");
  const firstError = regFeeResult.error || dobResult.error || completionResult.error;
  if (firstError) {
    document.getElementById("regError").innerHTML = `<div class="alert alert-danger">${firstError}</div>`;
    return false;
  }
  const seq = db.nextSeq++; // internal id only — not shown to anyone, doesn't need to be random
  const code = generateUniqueStudentCode(); // login ID — random, not sequential/guessable
  const tempPassword = randomCode(10);
  const certCode = `${CERT_PREFIX}-${new Date().getFullYear()}-${randomCode(10)}`;
  const regFee = regFeeResult.paise;

  db.students.push({
    id: "s" + seq,
    instituteId: session.instituteId,
    code, password: tempPassword,
    fullName, email: f.get("email") || null, phone: f.get("phone") || null,
    dateOfBirth: f.get("dateOfBirth") || null, gender: f.get("gender") || null,
    guardianName: f.get("guardianName") || null,
    addressLine1: f.get("addressLine1") || null, city: f.get("city") || null,
    state: f.get("state") || null, pincode: f.get("pincode") || null,
    courseName, completionDate: f.get("completionDate") || new Date().toISOString().slice(0, 10),
    registrationFeePaise: regFee, registrationFeePaid: false,
    certificateCode: certCode, certificateStatus: "ACTIVE",
    certificateRevokedReason: null, certificateRevokedAt: null,
    certificateDownloadCount: 0,
  });

  document.getElementById("app").innerHTML = adminChrome("students", `
    <div class="card card-pad">
      <div style="color:var(--success);font-weight:600;font-size:16px;">Student registered</div>
      <p style="color:var(--text-muted);font-size:13px;margin-top:4px;">Share these with the student — the password is shown only once.</p>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-top:18px;">
        <div class="kv"><dt>Student ID (login)</dt><dd class="mono">${code}</dd></div>
        <div class="kv"><dt>Temporary password</dt><dd class="mono">${tempPassword}</dd></div>
        <div class="kv"><dt>Certificate code</dt><dd class="mono">${certCode}</dd></div>
      </div>
      <div style="display:flex;gap:10px;margin-top:22px;">
        <button class="btn btn-outline" onclick="nav('/admin/students')">Back to students</button>
        <button class="btn btn-primary" onclick="nav('/admin/students/new')">Register another</button>
      </div>
    </div>
  `);
  return false;
}

function startEditStudent(id) {

function cancelEditStudent() {

function onSaveStudentEdit(e, id) {
  e.preventDefault();
  const s = db.students.find((x) => x.id === id);
  if (!s) return false;
  const f = new FormData(e.target);
  const fullName = (f.get("fullName") || "").trim();
  const courseName = (f.get("courseName") || "").trim();
  const email = (f.get("email") || "").trim();
  const phone = (f.get("phone") || "").trim();
  const msgEl = document.getElementById("editStudentMsg");
  if (!fullName || !courseName) {
    msgEl.innerHTML = `<div class="alert alert-danger" style="margin-top:12px;">Full name and course are required.</div>`;
    return false;
  }
  if (email && !isValidEmail(email)) {
    msgEl.innerHTML = `<div class="alert alert-danger" style="margin-top:12px;">That email address doesn't look valid.</div>`;
    return false;
  }
  if (phone && !isValidIndianMobile(phone)) {
    msgEl.innerHTML = `<div class="alert alert-danger" style="margin-top:12px;">Phone must be a valid 10-digit mobile number.</div>`;
    return false;
  }
  s.fullName = fullName;
  s.courseName = courseName;
  s.email = email || null;
  s.phone = phone || null;
  s.dateOfBirth = f.get("dateOfBirth") || null;
  s.gender = f.get("gender") || null;
  s.guardianName = f.get("guardianName") || null;
  s.completionDate = f.get("completionDate") || s.completionDate;
  s.addressLine1 = f.get("addressLine1") || null;
  s.city = f.get("city") || null;
  s.state = f.get("state") || null;
  s.pincode = f.get("pincode") || null;
  editingStudentId = null;
  render();
  return false;
}
function markPaid(id, which) {
  const s = db.students.find((x) => x.id === id);
  if (!s) return;
  s.registrationFeePaid = true;
  render();
}
function resetStudentPassword(id) {
  const s = db.students.find((x) => x.id === id);
  if (!s) return;
  const newPassword = randomCode(10);
  s.password = newPassword; // demo stand-in for scrypt-hashing + updating User.passwordHash
  justResetPasswordFor = id;
  justResetPasswordValue = newPassword;
  render();
}
function startRevokeCert(id) {
  revokingCertFor = id;
  render();
}
function cancelRevokeCert() {
  revokingCertFor = null;
  render();
}
function confirmRevokeCert(id) {
  const s = db.students.find((x) => x.id === id);
  if (!s) return;
  const reason = (document.getElementById("revokeReason")?.value || "").trim();
  s.certificateStatus = "REVOKED";
  s.certificateRevokedReason = reason || null;
  s.certificateRevokedAt = new Date().toISOString();
  revokingCertFor = null;
  render();
}
function reactivateCert(id) {
  const s = db.students.find((x) => x.id === id);
  if (!s) return;
  s.certificateStatus = "ACTIVE";
  s.certificateRevokedReason = null;
  s.certificateRevokedAt = null;
  render();
}

function onChangeStudentPassword(e) {

  }
  return `
  <div class="wrap-narrow" style="padding:56px 0 64px;text-align:center;">
    ${head}
    <div class="shake-in" style="margin-top:20px;color:var(--danger);">${ic("xCircle", 40)}</div>
    <p class="shake-in" style="font-size:17px;font-weight:700;color:var(--danger);margin-top:10px;">Not verified</p>
    <p style="color:var(--text-faint);font-size:12px;margin-top:4px;">${ic("clock", 13)} Checked ${checkedAt}</p>
    <div class="card card-pad shake-in" style="margin-top:20px;animation-delay:.1s;">
      <p style="color:var(--text-muted);font-size:13.5px;line-height:1.7;">No active certificate matches code <span class="mono">${code}</span>.<br/>Double-check the code for typos, or scan the QR printed on the certificate instead of typing it.</p>
      <p style="font-size:13px;margin-top:10px;"><a href="mailto:support@certivo.example?subject=${encodeURIComponent("Certificate concern — " + code)}" style="color:var(--brand);">Report a concern about this code</a></p>
    </div>
    ${verifyAnotherForm()}
    <p class="no-print" style="text-align:center;color:var(--text-faint);font-size:12px;margin-top:14px;">Verified by <strong>Certivo</strong></p>
  </div>`;
}
function verifyRow(label, value, mono) {
  return `<div style="display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border-soft);padding-bottom:8px;">
    <dt style="color:var(--text-muted);font-size:13px;">${label}</dt>
    <dd style="margin:0;font-weight:600;font-size:13.5px;" class="${mono ? "mono" : ""}">${value}</dd>
  </div>`;
}

/* =========================================================================
   Router
   ========================================================================= */
function render(loginError, statusError) {
  const path = currentPath();
  const app = document.getElementById("app");
  let html = "";

  // The "new password" box is shown once — clear it as soon as the admin
  // navigates away from that student's own detail page.
  if (justResetPasswordFor && path !== "/admin/students/" + justResetPasswordFor) {
    justResetPasswordFor = null;
    justResetPasswordValue = null;
  }
  if (certPreviewOpenFor && path !== "/student/portal") {
    certPreviewOpenFor = null;
  }
  if (path !== "/super-admin/dashboard") {
    renamingInstituteId = null;
    saJustResetPasswordFor = null;
    saJustResetPasswordValue = null;
    deletingInstituteId = null;
  }
  if (!path.startsWith("/admin/students/") || path === "/admin/students/new") {
    editingStudentId = null;
    revokingCertFor = null;
  }
  // Bulk issuance state lives only on the bulk page — clear it when leaving.
  if (path !== "/admin/students/bulk") {
    bulkRows = [];
    bulkResult = null;
  }
  if (path !== "/admin/settings") {
    settingsSavedFlash = false;
  }
  resetIdleTimer();

  if (path === "/") html = screenLanding();
  else if (path === "/directory") html = screenDirectory();
  else if (path === "/admin/login") {
    // Zero extra friction for the common case: exactly one approved
    // institute forwards straight to its own login. A genuine choice (0 or
    // 2+ approved institutes) shows the picker instead.
    const approved = db.institutes.filter((i) => i.status === "APPROVED");
    if (approved.length === 1) { nav("/admin/login/" + approved[0].slug); return; }
    html = screenAdminLoginPicker();
  }
  else if (path === "/admin/forgot-password") html = screenAdminForgotPassword();
  else if (path.startsWith("/admin/login/")) html = screenAdminLogin(path.split("/")[3], loginError, statusError);
  else if (path === "/institute/register") html = screenInstituteRegister();
  else if (path === "/admin/dashboard") { if (requireAdmin()) html = screenAdminDashboard(); else return; }
  else if (path === "/admin/students") { if (requireAdmin()) html = screenAdminStudents(); else return; }
  else if (path === "/admin/students/new") { if (requireAdmin()) html = screenAdminStudentNew(); else return; }
  else if (path === "/admin/settings") { if (requireAdmin()) html = screenAdminSettings(); else return; }
  else if (path === "/admin/students/bulk") { if (requireAdmin()) html = screenAdminStudentBulk(); else return; }
  else if (path.startsWith("/admin/students/")) { if (requireAdmin()) html = screenAdminStudentDetail(path.split("/").pop()); else return; }
  else if (path === "/super-admin/login") html = screenSuperAdminLogin(loginError);
  else if (path === "/super-admin/dashboard") { if (requireSuperAdmin()) html = screenSuperAdminDashboard(); else return; }
  else if (path === "/student/login") html = screenStudentLogin(loginError);
  else if (path === "/student/forgot-password") html = screenForgotPassword();
  else if (path === "/student/portal") { if (requireStudent()) html = screenStudentPortal(); else return; }
  else if (path.startsWith("/v/")) html = screenVerify(decodeURIComponent(path.slice(3)));
  else html = screenLanding();

  app.innerHTML = `<div class="screen active">${html}</div>`;
  updateChrome();
  window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
  initReveals();
  initCountUps();

  // The certificate preview's real PDF lives in a container this render just
  // painted (via certificateVisual()) — re-trigger the swap-in on every
  // render while the preview is open, not just the render right after
  // "Preview certificate" is clicked. loadRealCertificatePdf's own cache
  // means a render caused by something unrelated (e.g. a password change on
  // this same page) just re-shows the already-generated PDF instantly
  // instead of regenerating it.
  if (path === "/student/portal" && certPreviewOpenFor) {
    const previewStudent = db.students.find((x) => x.id === certPreviewOpenFor);
    if (previewStudent) loadRealCertificatePdf(previewStudent);
  }
}

/* =========================================================================
   Auto sign-out on inactivity (students only) — matches
   src/components/idle-logout.tsx in the real app. Any real activity
   (mouse, keyboard, touch, scroll) resets the timer; every render() also
   counts as activity (a fresh page counts as "just used it").
   ========================================================================= */
function resetIdleTimer() {
  if (idleTimer) clearTimeout(idleTimer);
  idleTimer = session?.kind === "student" ? setTimeout(idleLogout, IDLE_TIMEOUT_MS) : null;
}
function idleLogout() {
  if (session?.kind !== "student") return;
  session = null;
  nav("/student/login");
}
["mousemove", "mousedown", "keydown", "touchstart", "scroll"].forEach((evt) =>
  window.addEventListener(evt, resetIdleTimer, { passive: true }),
);
// Test-only hook — fires the idle timeout immediately instead of waiting
// IDLE_TIMEOUT_MS for real, so this can be verified without a 5-minute
// sleep. Never referenced by any real UI path.
window.__idleLogoutForTest = idleLogout;

if (!location.hash) location.hash = "#/";
applyTheme();
render();
</script>
